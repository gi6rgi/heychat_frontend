<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Warm the connections that gate first paint: scene art (LCP poster
         images) is served from Supabase Storage, content from the API. -->
    <link rel="preconnect" href="https://dbogszhiqygyeozgcnnq.supabase.co" />
    <link rel="preconnect" href="https://api.heyscenes.com" crossorigin />

    <title>HeyScenes · step into a scene with your AI companion</title>
    <meta
      name="description"
      content="Live voice conversations with AI characters: a first date, a job interview, a red-eye flight. You talk, they talk back, and you get a debrief after the scene."
    />
    <link rel="canonical" href="https://heyscenes.com/" />
    <meta name="theme-color" content="#1a1916" />

    <!-- Home-screen / installed-app behaviour (iOS reads the apple-* variants). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="HeyScenes" />

    <meta property="og:site_name" content="HeyScenes" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://heyscenes.com/" />
    <meta property="og:title" content="HeyScenes · step into a scene with your AI companion" />
    <meta
      property="og:description"
      content="Live voice conversations with AI characters: a first date, a job interview, a red-eye flight. You talk, they talk back, and you get a debrief after the scene."
    />
    <meta property="og:image" content="https://heyscenes.com/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HeyScenes · step into a scene with your AI companion" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HeyScenes · step into a scene with your AI companion" />
    <meta
      name="twitter:description"
      content="Live voice conversations with AI characters: a first date, a job interview, a red-eye flight. You talk, they talk back, and you get a debrief after the scene."
    />
    <meta name="twitter:image" content="https://heyscenes.com/og-preview.png" />

    <!-- Static JSON-LD so crawlers see structured data without running the SPA. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "HeyScenes",
      "url": "https://heyscenes.com",
      "applicationCategory": "LifestyleApplication",
      "operatingSystem": "Web",
      "description": "Live voice conversations with AI characters: a first date, a job interview, a red-eye flight. You talk, they talk back, and you get a debrief after the scene.",
      "image": "https://heyscenes.com/og-preview.png"
    }
    </script>

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
